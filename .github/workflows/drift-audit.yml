name: Drift audit

# The "watch" step of the self-healing loop, as a native scheduled workflow —
# no Claude cloud cost, no interactive auth. Reports the time-based drift that
# per-PR CI can't catch (dependency freshness, security advisories, release
# housekeeping) to the run's step summary. Fails — and so emails — only on an
# actionable high/critical advisory. Per-PR deterministic invariants live in the
# test suite. Figma↔code COMPONENT parity is the figma-parity job below —
# detection on schedule, repair on demand via /figma-pull and /figma-push
# (Figma has no headless node-write API on any plan). It skips cleanly until
# a FIGMA_TOKEN secret (Figma PAT, file read scope) exists.

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch: {}

jobs:
  audit:
    name: Weekly drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the release-housekeeping check

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm run drift-audit

  figma-parity:
    name: Figma component parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Detection only — repair is /figma-pull (Figma moved) or /figma-push
      # (code moved). Skips cleanly while the FIGMA_TOKEN secret is absent.
      - name: Component parity (Figma ↔ code)
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/figma-drift.mjs
