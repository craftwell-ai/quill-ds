name: Figma parity

# Daily Figma↔code component parity: detection AND deterministic repair.
# scripts/figma-drift.mjs --repair diffs each synced component's live Figma
# node (REST file read — works headless on the Pro plan) against the committed
# baseline in figma/sync-state.json:
#
#   value-level drift (re-bound token, changed text) → repaired in place here,
#     opened as an auto-merging PR — same bar as self-heal: a deterministic
#     edit with a provably correct answer, gated by the required check;
#   structural drift → exit 2, this job fails and emails: run /figma-pull;
#   code moved without a mirror → exit 2 as well: run /figma-push (Figma has
#     no headless node-write API on any plan, so that direction is never a bot).
#
# Skips cleanly until a FIGMA_TOKEN secret exists (Figma PAT, file read scope).

on:
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC
  workflow_dispatch:
    inputs:
      adopt:
        description: 'Adopt the candidates in figma/sync-state.json into the parity baseline (opens a PR for review; never self-merges)'
        type: boolean
        default: false
      snapshot:
        description: 'Re-read every mirrored pattern frame into figma/pattern-baseline.json after pages were rebuilt (opens a PR for review; never self-merges)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: figma-parity
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Adoption runs land on their own branch and wait for a human: a baseline
      # entry is a claim about what "in sync" means, so someone reads the summary.
      ADOPT: ${{ inputs.adopt == true }}
      # A snapshot run rewrites the pattern content baseline from the file — a human reads that diff.
      SNAPSHOT: ${{ inputs.snapshot == true }}
      BRANCH: ${{ inputs.adopt == true && 'auto/figma-adopt' || inputs.snapshot == true && 'auto/figma-snapshot' || 'auto/figma-pull' }}
      HAS_PAT: ${{ secrets.AUTOMATION_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The script is dependency-free (node builtins + fetch); no npm ci.
      - name: Parity check + deterministic repair
        id: parity
        run: |
          set +e
          node scripts/figma-drift.mjs --repair $([ "$ADOPT" = 'true' ] && echo '--adopt') $([ "$SNAPSHOT" = 'true' ] && echo '--snapshot-patterns')
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Detect repairs
        id: drift
        run: |
          if git diff --quiet; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
          else
            echo "repaired=true" >> "$GITHUB_OUTPUT"
            {
              if [ "$ADOPT" = 'true' ]; then echo "## Parity baseline: adoption result"; elif [ "$SNAPSHOT" = 'true' ]; then echo "## Pattern content baseline re-read from Figma"; else echo "## Value-level Figma edits pulled into code"; fi
              echo
              echo '```'
              git diff --stat
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close a repair PR that reality already fixed
        if: steps.drift.outputs.repaired == 'false'
        run: |
          set -euo pipefail
          N="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -n "$N" ]; then
            gh pr comment "$N" --body 'Superseded — the Figma file and code no longer drift (an interactive /figma-pull or /figma-push likely synced them first). Closing automatically.'
            gh pr close "$N" --delete-branch
            echo "Closed obsolete repair PR #$N." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open (or update) the auto-pull PR
        if: steps.drift.outputs.repaired == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -B "$BRANCH"
          git add -u
          if [ "$ADOPT" = 'true' ]; then
            git commit \
              -m 'chore(figma-sync): adopt Figma twins into the parity baseline' \
              -m 'Opened by .github/workflows/figma-parity.yml with the adopt input. Each adopted component was read from Figma over the REST API and matched against its code file: the classes its bindings translate to all sit in one class string there, so Figma and code agreed at adoption. Candidates that disagreed are listed in the run summary, not adopted. Review the summary, then merge by hand.'
          elif [ "$SNAPSHOT" = 'true' ]; then
            git commit \
              -m 'chore(figma-sync): re-read the pattern content baseline from Figma' \
              -m 'Opened by .github/workflows/figma-parity.yml with the snapshot input after pattern pages were rebuilt. figma/pattern-baseline.json now holds what every mirrored frame shows (texts, icon instances, top-level instances) as read over the REST API; the offline test still checks that content against what each block renders. Review the diff, then merge by hand.'
          else
            git commit \
              -m 'fix(figma-sync): pull value-level Figma edits into code' \
              -m 'Opened automatically by .github/workflows/figma-parity.yml. Every edit here is a deterministic token-binding or text translation from the Figma component (see the run summary) — structural changes are never auto-pulled. Baseline updated in figma/sync-state.json.'
          fi
          git push --force-with-lease origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            if [ "$ADOPT" = 'true' ]; then
              printf '%s\n' \
                'Figma twins adopted into the parity baseline (`figma/sync-state.json`) by the figma-parity workflow with its `adopt` input. Each one was read over the REST API and matched against its code file — the classes its bindings translate to all sit in one class string there — so Figma and code agreed at adoption. Candidates that disagreed are listed in the run summary and stay out until a human settles them with `/figma-pull` or `/figma-push`.' \
                '' \
                'Not self-merging on purpose: read the run summary, then merge.' \
                > /tmp/pr-body.md
              gh pr create --base main --head "$BRANCH" \
                --title 'chore(figma-sync): adopt Figma twins into the parity baseline' \
                --body-file /tmp/pr-body.md
            elif [ "$SNAPSHOT" = 'true' ]; then
              printf '%s\n' \
                'The pattern content baseline (`figma/pattern-baseline.json`) was re-read from the Figma file by the figma-parity workflow with its `snapshot` input — the step after pattern pages are rebuilt. Each mirrored frame now records the texts, icon instances and top-level instances it shows; `scripts/figma-pattern-parity.test.mjs` checks that against what the blocks render.' \
                '' \
                'Not self-merging on purpose: read the diff, then merge.' \
                > /tmp/pr-body.md
              gh pr create --base main --head "$BRANCH" \
                --title 'chore(figma-sync): re-read the pattern content baseline from Figma' \
                --body-file /tmp/pr-body.md
            else
              printf '%s\n' \
                'A designer changed value-level properties (token bindings / text) on a synced component in Figma. `figma-parity.yml` translated them into the code twin deterministically and updated the parity baseline.' \
                '' \
                'Only edits with a provably correct answer are auto-pulled — structural changes fail the workflow instead and ask for an interactive `/figma-pull`. Merges itself once the required check is green.' \
                > /tmp/pr-body.md
              gh pr create --base main --head "$BRANCH" \
                --title 'fix(figma-sync): pull value-level Figma edits into code' \
                --body-file /tmp/pr-body.md
            fi
          fi

          if [ "$ADOPT" != 'true' ] && [ "$SNAPSHOT" != 'true' ]; then gh pr merge --auto --merge "$BRANCH" || true; fi

      - name: Fail on drift that needs a human
        if: steps.parity.outputs.code == '2'
        run: |
          echo 'Unrepairable drift remains — see the parity step log for the /figma-pull or /figma-push command to run.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Warn when the PR cannot self-merge
        if: steps.drift.outputs.repaired == 'true' && env.HAS_PAT != 'true'
        run: |
          {
            echo
            echo '> [!WARNING]'
            echo '> Opened with the default `GITHUB_TOKEN`, so **CI will not run on this PR**'
            echo '> and auto-merge cannot complete. Add an `AUTOMATION_TOKEN` secret to close'
            echo '> the loop — see scripts/DRIFT-AUDIT.md.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Parity 6 (CRA-224): the picture check. Structural checks compare values; this
  # exports every mirrored page from Figma, renders its story at the same width, and
  # diffs the two with a tolerance for font rasterisation, against the accepted
  # numbers in figma/visual-baseline.json. Report-only (continue-on-error) until the
  # tolerance has held for a while; then drop that line and add --strict.
  # Its own job: it needs npm ci, a Storybook build and a browser, which the
  # dependency-free parity job deliberately does not.
  visual:
    needs: parity
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Build Storybook
        run: npm run build-storybook -- -o .visual/sb --quiet
      - name: Figma ↔ Storybook visual diff
        run: node scripts/figma-visual-diff.mjs --out .visual/out --sb .visual/sb
      - name: Upload the strips (Figma | Storybook | diff, per pair)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-visual-diff
          path: .visual/out
          retention-days: 14
